name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -failfast ./...

  changelog:
    runs-on: ubuntu-latest
    steps:
      # The changelog is compared against the tags, which a shallow checkout lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://forge.sarak.sh/actions/changelog@v1
        with:
          off: oci-incompatible-version
